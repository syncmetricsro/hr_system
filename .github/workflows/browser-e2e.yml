name: Browser end-to-end tests

# Manual only, on purpose (2026-08-04). The suite outgrew running it per slice,
# so it is not part of the per-commit gate and application-ci.yml does not
# invoke it. Run it before a staging deploy:
#
#   gh workflow run browser-e2e.yml --ref <sha-or-branch>
#
# or locally with scripts/playwright_e2e.sh. Adding any automatic trigger here
# puts it back in the per-commit loop, which is what this change removed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Deliberately avoid actions/checkout: this repository's build policy
      # prohibits adding a Node-based action runtime to the CI supply chain.
      - name: Check out exact revision without Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          unset auth

      - name: Run both-client browser gate
        run: scripts/playwright_e2e.sh
